spec:
  type: feature
  name: 用户列表导出 Excel
  id: feature-user-export
  version: 4
  updated: "2026-09-23"
  # 六个状态：draft | ready | in_progress | done | verified | blocked
  # done = 执行者自查完成（待复核）；verified = 独立复核者或用户本人确认通过
  status: verified
  related: []
  goal: 运营在后台用户列表页按当前筛选条件导出 Excel 文件。
  context: 运营每周需要把筛选后的用户名单交给市场团队，目前只能人工复制，易错且费时。相关页面：/admin/users。审计日志的结论来自 open_questions 的答复。
  assumptions:
    - 单次导出上限 5 万行，超出时提示并建议缩小筛选范围。
    - 导出为异步任务，前端轮询任务状态。
  # 不问就不能开工；这份的阻塞问题都已经问过用户并写回答案，所以为空
  blocking_questions: []
  # 可以为空，但必须让用户知情：status 只能是 answered | assumed | open
  # 纯字符串写法 = 还没问过用户（历史写法，不要再用）
  open_questions:
    - q: 是否需要记录导出审计日志？
      status: answered
      asked_at: "2026-09-18"
      answer: 需要，至少记下操作者、筛选条件和导出行数；先不做查询页面，能查日志就行。
    - q: 导出文件保留多久？
      status: assumed
      asked_at: "2026-09-18"
      assumption: 按现有导出中心规则保留 7 天，过期自动清理。
      if_wrong: 市场部可能在周报里引用过期文件，需要重新导出；不影响数据正确性。
      confirm_by: 上线后第一次运营周报（2026-09-30）前找运营确认一次。
  inputs:
    - name: 筛选条件
      description: 用户列表当前生效的筛选（状态、注册时间、渠道）
      source: 前端页面 query 参数
      required: false
    - name: 操作者
      description: 当前登录管理员，用于权限校验和审计
      source: 会话
      required: true
  outputs:
    format: xlsx
    schema: "user_export.schema.json（列：用户ID、昵称、手机号、注册时间、状态、渠道）"
    path: 导出中心，保留 7 天
  constraints:
    - 只能导出当前操作者有权限查看的字段
    - 手机号需按现有脱敏规则处理
    - 不使用新的第三方依赖
  out_of_scope:
    - 不做定时导出
    - 不做邮件推送
  tools:
    - 现有导出任务服务
  steps:
    - 列表页新增“导出”按钮，携带当前筛选条件
    - 后端校验权限并创建异步导出任务
    - 任务生成 xlsx 并写入导出中心
    - 前端轮询状态，完成后提供下载
  acceptance_criteria:
    - 选择筛选条件后点击“导出”，30 秒内导出中心出现对应任务，文件行数与筛选结果一致
    - 无筛选条件导出时返回全部有权限的用户，上限 5 万行
    - 导出文件手机号字段与页面显示一致（均已脱敏）
    - 无导出权限的账号点击按钮返回 403，且不创建任务
    - 导出行数超过 5 万时返回提示“请缩小筛选范围”，不生成文件
  failure_handling:
    - scenario: 导出任务失败
      handling: 任务标记失败并允许用户重试；连续失败 3 次告警
    - scenario: 生成超时
      handling: 10 分钟超时后标记失败并清理临时文件
  examples:
    - input: 筛选 status=active、channel=wechat
      output: 生成 xlsx，仅含 active 且来自 wechat 的用户，列与 schema 一致
  # 每次状态转移追加一条，不要覆盖历史；首次从无到有 from 写 none
  # 末条的 to 必须等于顶层 status，末条的 version 必须等于顶层 version（改状态必须 version +1）
  status_log:
    - date: "2026-09-18"
      from: none
      to: ready
      by: user
      version: 1
      note: 问题问过用户并写回答复，转入 ready
    - date: "2026-09-19"
      from: ready
      to: in_progress
      by: impl-agent
      version: 2
      note: 开始实现导出任务与前端轮询
    - date: "2026-09-22"
      from: in_progress
      to: done
      by: impl-agent
      version: 3
      note: 自查 5 项 AC 有据，单测 44 passed；等独立复核
    - date: "2026-09-23"
      from: done
      to: verified
      by: review-agent
      version: 4
      note: 独立复核逐条 AC 与命令输出，补了 5.1 万行边界用例后通过
  # status=done / verified 时必填：结论 + 逐条 AC 结果 + 证据
  # 推荐一条命令写入：python3 scripts/spec_status.py <spec.yaml> --to done --result "..." --acceptance "AC#1|pass|证据"
  verification:
    result: 5/5 AC 通过；单测 44 passed，5 万行导出耗时 12s（要求 30s 内）
    verified_by: independent
    verifier: review-agent
    verified_at: "2026-09-23"
    acceptance:
      - criterion: "AC#1 选择筛选条件后点击导出，30 秒内出现任务且文件行数与筛选结果一致"
        status: pass
        evidence: "POST /api/admin/users/export -> task_id=exp-8891，12s 完成；文件 51234 行，与筛选 SQL count 一致"
      - criterion: "AC#2 无筛选条件导出返回全部有权限用户，上限 5 万行"
        status: pass
        evidence: "空筛选导出 49980 行（该账号权限内总数），未超上限"
      - criterion: "AC#3 导出文件手机号字段与页面一致（脱敏）"
        status: pass
        evidence: "抽查 20 行，格式均为 138****1234，与页面一致"
      - criterion: "AC#4 无导出权限账号点击按钮返回 403 且不创建任务"
        status: pass
        evidence: "viewer@example.com -> 403；导出中心无新任务（查询前后任务数不变）"
      - criterion: "AC#5 超过 5 万行返回提示且不生成文件"
        status: pass
        evidence: "构造 51234 行账户 -> 提示“请缩小筛选范围”，导出中心无文件"
    commands:
      - "pnpm --filter admin test -- user-export -> 2 suites / 44 passed"
      - "curl -X POST /api/admin/users/export -> 200 {task_id: exp-8891}"
    artifacts:
      - tmp/verify-report-user-export.md
    unverified:
      - 未在 10 万行以上数据量验证（生产当前最大筛选结果约 6 万行；超限路径已用 5.1 万行构造用例覆盖）
  # 遗留问题：写清优先级与触发条件，不要散落在对话里
  follow_ups:
    - "F1（中）：审计日志先只落库，查询页面等导出中心 v2 再做；触发条件：导出中心 v2 排期确定。"
    - "F2（低）：导出任务暂不支持自动重试，失败需人工点重试；触发条件：连续失败告警出现 3 次以上。"
