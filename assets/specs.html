<style>
/* ---------- 主题变量：不依赖 Tailwind 也能保证可读 ---------- */
:root{
  --bg:#eef2f7; --panel:#ffffff; --panel-2:#f8fafc; --panel-3:#eef2f7;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --border:#e2e8f0; --border-strong:#cbd5e1; --accent:#4f46e5; --accent-weak:rgba(79,70,229,.10);
  --code-bg:#f1f5f9; --code-fg:#0f172a;
  --ok:#059669; --ok-bg:rgba(16,185,129,.12);
  --warn:#b45309; --warn-bg:rgba(245,158,11,.15);
  --err:#dc2626; --err-bg:rgba(239,68,68,.12);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06);
}
.dark{
  --bg:#070b16; --panel:#0f172a; --panel-2:#131f38; --panel-3:#1e293b;
  --text:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
  --border:#1e293b; --border-strong:#334155; --accent:#818cf8; --accent-weak:rgba(129,140,248,.14);
  --code-bg:#0b1220; --code-fg:#cbd5e1;
  --ok:#34d399; --ok-bg:rgba(52,211,153,.12);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13);
  --err:#f87171; --err-bg:rgba(248,113,113,.13);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 22px rgba(0,0,0,.32);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none !important}

/* ---------- 布局（自带，不依赖 Tailwind） ---------- */
#spec-viewer-app{display:flex;height:100%;min-height:100vh}
#sidebar{display:flex;flex-direction:column;width:21rem;flex:none;height:100vh;background:var(--panel);border-right:1px solid var(--border)}
#spec-list{flex:1;overflow-y:auto;padding:0 .5rem 1rem}
#main{flex:1;min-width:0;height:100vh;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:960px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
@media(max-width:860px){
  #spec-viewer-app{flex-direction:column}
  #sidebar{width:100%;height:auto;max-height:44vh;border-right:0;border-bottom:1px solid var(--border)}
  #main{height:auto;min-height:52vh}
  .wrap{padding:1.1rem .9rem 3rem}
}

/* ---------- 通用 ---------- */
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card-pad{padding:1rem 1.15rem}
.section-title{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.6rem;margin:0}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.field-label{font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.prose{white-space:pre-wrap;word-break:break-word}
code.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:.85em;background:var(--code-bg);color:var(--code-fg);padding:.1em .42em;border-radius:.35rem}
.codeblock{position:relative;margin:0;background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:.7rem .85rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.79rem;white-space:pre-wrap;word-break:break-word;color:var(--code-fg);overflow-x:auto;line-height:1.55}
.copy-btn{font-size:.68rem;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:.4rem;padding:.08rem .42rem;cursor:pointer}
.copy-btn:hover{color:var(--text);border-color:var(--border-strong)}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:700;text-decoration:underline;padding:0;font-size:inherit}

/* ---------- 按钮 / 表单 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border-radius:9px;font-size:.82rem;font-weight:700;padding:.42rem .7rem;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--border-strong);background:var(--panel-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;padding:.35rem .5rem}
.btn-ghost:hover{background:var(--panel-3)}
.input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:.42rem .6rem;font-size:.84rem;color:var(--text);outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
select.input{cursor:pointer}

/* ---------- 侧栏 ---------- */
.side-group{display:flex;align-items:center;gap:.45rem;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:.55rem .5rem .25rem}
.side-dot{width:.5rem;height:.5rem;border-radius:99px;flex:none}
.side-item{display:flex;flex-direction:column;gap:.12rem;width:100%;text-align:left;padding:.5rem .6rem;border-radius:10px;border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;font:inherit}
.side-item:hover{background:var(--panel-2)}
.side-item.active{background:var(--accent-weak);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.side-item-name{font-size:.85rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.side-item-meta{font-size:.69rem;color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item-badges{display:flex;gap:.3rem;margin-top:.2rem;flex-wrap:wrap}

/* ---------- 徽章 / chip ---------- */
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.1rem .55rem;border-radius:9999px;font-size:.72rem;font-weight:800;line-height:1.6;background:var(--c-bg,#f1f5f9);color:var(--c,#475569);white-space:nowrap}
.badge{display:inline-flex;align-items:center;padding:.06rem .42rem;border-radius:.38rem;font-size:.66rem;font-weight:800;line-height:1.5;white-space:nowrap}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-err{background:var(--err-bg);color:var(--err)}
.t-feature{--c:#059669;--c-bg:rgba(16,185,129,.13)}
.t-bugfix{--c:#e11d48;--c-bg:rgba(244,63,94,.13)}
.t-refactor{--c:#0284c7;--c-bg:rgba(14,165,233,.13)}
.t-research{--c:#7c3aed;--c-bg:rgba(139,92,246,.13)}
.t-ops{--c:#d97706;--c-bg:rgba(245,158,11,.15)}
.t-unknown{--c:#64748b;--c-bg:rgba(100,116,139,.15)}
.dark .t-feature{--c:#34d399}
.dark .t-bugfix{--c:#fb7185}
.dark .t-refactor{--c:#38bdf8}
.dark .t-research{--c:#a78bfa}
.dark .t-ops{--c:#fbbf24}
.s-draft{--c:#64748b;--c-bg:rgba(100,116,139,.16)}
.s-ready{--c:#059669;--c-bg:rgba(16,185,129,.15)}
.s-in_progress{--c:#2563eb;--c-bg:rgba(59,130,246,.15)}
.s-done{--c:#0d9488;--c-bg:rgba(20,184,166,.15)}
.s-blocked{--c:#dc2626;--c-bg:rgba(239,68,68,.15)}
.s-unknown{--c:#64748b;--c-bg:rgba(100,116,139,.16)}
.dark .s-ready{--c:#34d399}
.dark .s-in_progress{--c:#60a5fa}
.dark .s-done{--c:#2dd4bf}
.dark .s-blocked{--c:#f87171}

/* ---------- 表格 / 列表 ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:.83rem}
.tbl th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel-2);padding:.5rem .7rem;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:800}
.tbl td{padding:.55rem .7rem;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.bullets{margin:0;padding-left:1.15rem;display:grid;gap:.3rem}
.bullets li{padding-left:.05rem}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:step;display:grid;gap:.5rem}
.steps li{position:relative;padding-left:2.05rem;counter-increment:step}
.steps li::before{content:counter(step);position:absolute;left:0;top:.08rem;width:1.4rem;height:1.4rem;border-radius:99px;background:var(--accent-weak);color:var(--accent);font-size:.72rem;font-weight:800;display:grid;place-items:center}
.kv{display:grid;grid-template-columns:8.5rem 1fr;gap:.6rem;font-size:.86rem;padding:.4rem 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}
.kv-k{color:var(--muted);font-weight:700}
.kv-v{white-space:pre-wrap;word-break:break-word}
@media(max-width:640px){.kv{grid-template-columns:1fr;gap:.1rem}}

/* ---------- 提示块 ---------- */
.callout{border:1px solid var(--border);border-left-width:3px;border-radius:10px;padding:.6rem .8rem;background:var(--panel-2);font-size:.86rem;word-break:break-word}
.callout-ok{border-left-color:var(--ok)}
.callout-warn{border-left-color:var(--warn)}
.callout-err{border-left-color:var(--err)}
.callout-title{font-weight:800;font-size:.78rem;margin-bottom:.15rem}
.callout-ok .callout-title{color:var(--ok)}
.callout-warn .callout-title{color:var(--warn)}
.callout-err .callout-title{color:var(--err)}

/* ---------- 验收清单 ---------- */
.checklist{display:grid;gap:.4rem}
.check-item{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .65rem;border:1px solid var(--border);border-radius:10px;background:var(--panel);cursor:pointer}
.check-item:hover{border-color:var(--border-strong)}
.check-item.weak{border-color:var(--warn)}
.check-item input{margin-top:.28rem;width:1rem;height:1rem;accent-color:var(--accent);flex:none;cursor:pointer}
.check-num{flex:none;width:1.4rem;height:1.4rem;border-radius:99px;background:var(--panel-3);color:var(--muted);font-size:.72rem;font-weight:800;display:grid;place-items:center}
.check-text{font-size:.87rem;white-space:pre-wrap;word-break:break-word}
.check-text.done{color:var(--muted);text-decoration:line-through}
.check-progress{font-size:.72rem;color:var(--muted);text-align:right;margin-top:.4rem}
.tag-warn{font-size:.62rem;font-weight:800;color:var(--warn);border:1px solid var(--warn);border-radius:.32rem;padding:0 .28rem;margin-left:.35rem;white-space:nowrap}

/* ---------- 加载区 ---------- */
.dropzone{border:2px dashed var(--border-strong);border-radius:12px;padding:1.5rem 1rem;text-align:center;color:var(--muted);font-size:.88rem;transition:.15s}
.dropzone.drag{border-color:var(--accent);background:var(--accent-weak);color:var(--text)}
.raw{margin-top:1.75rem}
.raw summary{cursor:pointer;font-size:.8rem;color:var(--muted);font-weight:700}
.val-summary{cursor:pointer;display:flex;align-items:center;gap:.5rem;list-style:none}
.val-summary::-webkit-details-marker{display:none}

/* ---------- 其它 ---------- */
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%) translateY(1rem);opacity:0;pointer-events:none;
  background:#0f172a;color:#fff;padding:.5rem .95rem;border-radius:9px;font-size:.82rem;font-weight:600;transition:.2s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dark #toast{background:#e2e8f0;color:#0f172a}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="spec-viewer-app">
  <aside id="sidebar">
    <div style="padding:1rem 1rem .75rem;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:.55rem">
        <div style="width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--accent)">S</div>
        <div style="min-width:0;flex:1">
          <div style="font-weight:800;line-height:1.2">SPEC 浏览器</div>
          <div id="projectLabel" class="faint" style="font-size:.72rem">未加载</div>
        </div>
        <button id="themeBtn" class="btn btn-ghost" title="切换深浅色">◐</button>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:.75rem">
        <button id="pickBtn" class="btn btn-primary" style="flex:1">选择 specs 文件夹</button>
        <button id="reloadBtn" class="btn btn-ghost" title="重新加载">↻</button>
      </div>
      <input id="search" type="search" class="input" style="margin-top:.65rem" placeholder="搜索名称 / id / 目标 / 内容…">
    </div>
    <div id="filters" style="padding:.7rem 1rem;border-bottom:1px solid var(--border);font-size:.82rem"></div>
    <div id="stats" class="faint" style="padding:.5rem 1rem;font-size:.72rem"></div>
    <nav id="spec-list"></nav>
  </aside>
  <main id="main">
    <div id="welcome" style="height:100%;display:grid;place-items:center;padding:1.5rem">
      <div class="card card-pad" style="max-width:34rem;width:100%">
        <h1 style="margin:0;font-size:1.25rem;font-weight:800">SPEC 浏览器</h1>
        <p class="muted" style="font-size:.86rem;margin:.5rem 0 0">
          一次性读取 <code class="code">specs/</code> 目录下所有符合 spec-builder 规则的 YAML，排版成人类可读的视图，并按规则做校验。本文件只是一份查看器，不会修改任何 SPEC。
        </p>
        <div id="dropzone" class="dropzone" style="margin-top:1rem">
          把 <b>specs 文件夹</b>拖到这里，或 <button type="button" id="pickBtn2" class="link">选择文件夹</button>
        </div>
        <div class="muted" style="font-size:.8rem;margin-top:1rem">若用本地服务打开，可自动发现同目录 YAML：</div>
        <div style="display:flex;gap:.5rem;align-items:center;margin-top:.35rem">
          <code class="code" id="httpCmd" style="flex:1">python3 -m http.server 8000</code>
          <button class="copy-btn" data-copy="python3 -m http.server 8000">复制</button>
        </div>
        <p class="faint" style="font-size:.74rem;margin:.45rem 0 0">在项目根目录执行后访问 <code class="code">http://localhost:8000/specs/specs.html</code></p>
        <div id="loadError" style="margin-top:1rem"></div>
      </div>
    </div>
    <article id="detail" hidden></article>
  </main>
</div>

};

/* ================= 小工具 ================= */
var BT=String.fromCharCode(96);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
function isObj(v){return v!==null&&typeof v==='object'&&!Array.isArray(v);}
function isArr(v){return Array.isArray(v);}
function asArr(v){return v==null?[]:(Array.isArray(v)?v:[v]);}
function inline(s){
  var t=esc(s);
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  var parts=t.split(BT);
  if(parts.length>1){t=parts.map(function(p,i){return i%2===1?'<code class="code">'+p+'</code>':p;}).join('');}
  return t;
}
function section(id,title,inner){
  return '<section class="mt-7" id="sec-'+escAttr(id)+'"><h2 class="section-title">'+esc(title)+'</h2><div class="mt-3">'+inner+'</div></section>';

function kv(k,inner){return '<div class="kv"><div class="kv-k">'+esc(k)+'</div><div class="kv-v">'+inner+'</div></div>';}
function table(cols,rows){
  var h='<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  h+=cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('');

  rows.forEach(function(r){h+='<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';});
  h+='</tbody></table></div>';
  return h;

/* ================= 校验（validate_spec.py 的浏览器版） ================= */
function isBlank(v){
  if(v===null||v===undefined){return true;}
  if(typeof v==='string'){var t=v.trim();return t===''||t.toUpperCase()==='TBD';}
  if(Array.isArray(v)){return v.length===0||v.every(isBlank);}
  if(isObj(v)){var ks=Object.keys(v);return ks.length===0||ks.every(function(k){return isBlank(v[k]);});}
  return false;
}
function weakItem(item){
  var s=String(item),word=null,i;
  for(i=0;i<WEAK_WORDS.length;i++){if(s.indexOf(WEAK_WORDS[i])>=0){word=WEAK_WORDS[i];break;}}
  if(!word){return false;}
  for(i=0;i<MEASURABLE.length;i++){if(s.indexOf(MEASURABLE[i])>=0){return false;}}
  return s.length<25;
}
function validateSpec(spec){
  var errors=[],warnings=[],checks=[];
  var stype=spec.type;
  if(KNOWN_TYPES.indexOf(stype)<0){
    errors.push('type 缺失或非法：'+JSON.stringify(stype)+'；应为 '+KNOWN_TYPES.join('/'));
    return {errors:errors,warnings:warnings,checks:checks};
  }
  checks.push('type = '+stype);
  var status=spec.status;
  if(KNOWN_STATUS.indexOf(status)<0){warnings.push('status 非法或缺失：'+JSON.stringify(status)+'；建议取值 '+KNOWN_STATUS.join('/'));}
  else{checks.push('status = '+status);}

  COMMON_REQUIRED.concat(TYPE_REQUIRED[stype]||[]).forEach(function(f){
    if(!(f in spec)){errors.push('缺少必填字段：'+f);}
    else if(isBlank(spec[f])){errors.push('必填字段为空：'+f);}
  });
  COMMON_PRESENT.forEach(function(f){if(!(f in spec)){errors.push('缺少字段（可为空数组）：'+f);}});

  var sid=spec.id;
  if(isBlank(sid)){errors.push('缺少稳定标识 id（格式 <type>-<slug>）');}
  else{
    sid=String(sid);
    if(sid.indexOf(String(stype)+'-')!==0){errors.push('id 应以 '+stype+'- 开头：'+JSON.stringify(sid));}
    else if(/\s/.test(sid)||/[A-Z]/.test(sid)){warnings.push('id 建议全小写、无空格：'+JSON.stringify(sid));}
    checks.push('id = '+sid);
  }

  var version=spec.version;
  if(typeof version!=='number'||!isFinite(version)||Math.floor(version)!==version||version<1){warnings.push('version 应为 >= 1 的整数：'+JSON.stringify(version));}
  var updated=spec.updated;
  if(typeof updated!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(updated)){warnings.push('updated 应为 YYYY-MM-DD：'+JSON.stringify(updated));}

  if(status==='ready'&&!isBlank(spec.blocking_questions)){errors.push('status=ready 但 blocking_questions 非空；请先解决阻塞问题，或把 status 改为 draft');}

  var nested=NESTED_REQUIRED[stype]||{};
  Object.keys(nested).forEach(function(parent){
    var node=spec[parent];
    if(isObj(node)){nested[parent].forEach(function(child){if(isBlank(node[child])){errors.push('必填子字段为空：'+parent+'.'+child);}});}
  });

  var criteria=asArr(spec.acceptance_criteria).map(function(c){return typeof c==='string'?c:JSON.stringify(c);});
  if(!criteria.length){errors.push('acceptance_criteria 为空或缺失');}
  else{
    checks.push('acceptance_criteria = '+criteria.length+' 条');
    criteria.forEach(function(item,i){if(weakItem(item)){warnings.push('第 '+(i+1)+' 条验收标准疑似不可验证（含弱词且无量化线索）：'+item);}});
    if((stype==='feature'||stype==='refactor'||stype==='ops')&&criteria.length<3){warnings.push('验收标准偏少（'+criteria.length+' 条）；建议覆盖正常、边界、失败路径');}
    var joined=criteria.join(' ');
    if(!FAILURE_HINTS.some(function(h){return joined.indexOf(h)>=0;})){warnings.push('验收标准似乎只覆盖正常路径；建议补充边界（空/上限/并发）与失败（异常/超时/权限）路径');}
  }

  if(!asArr(spec.examples).length){warnings.push('没有 examples；建议至少补一个输入→输出示例');}

  if(stype==='bugfix'){
    var root=isObj(spec.root_cause)?spec.root_cause:{};
    var fix=isObj(spec.fix)?spec.fix:{};
    if(root.confirmed===false&&!isBlank(fix.approach)){warnings.push('root_cause.confirmed 为 false；fix 应先包含定位/验证步骤，不要直接改代码');}
    var cj=criteria.join(' ');
    if(criteria.length&&!(cj.indexOf('复现')>=0||cj.indexOf('回归')>=0||cj.indexOf('不再')>=0||cj.indexOf('原')>=0)){warnings.push('bugfix 验收标准建议包含“原复现步骤不再出现”或“回归测试通过”');}
  }
  if(stype==='refactor'){
    var bc=asArr(spec.behavior_contract);
    if(bc.length&&bc.length<2){warnings.push('behavior_contract 至少列出 2 条必须保持不变的外部行为');}
  }
  if(stype==='ops'){
    var risks=asArr(spec.risks);
    if(risks.length&&risks.some(isBlank)){warnings.push('risks 条目不完整');}
    var mon=asArr(spec.monitoring);
    if(mon.length&&mon.some(isBlank)){warnings.push('monitoring 条目不完整');}
  }
  return {errors:errors,warnings:warnings,checks:checks};
}

/* ================= 状态 ================= */
var state={specs:[],selected:null,current:null,q:'',type:'all',status:'all',hideNon:true,theme:'light'};
var $=function(id){return document.getElementById(id);};

/* ================= 解析与入库 ================= */
function buildRecord(e){
  var rec={name:e.name||'(未命名)',path:e.path||e.name||'',raw:e.text||'',parseError:null,isSpec:false,spec:null,type:'unknown',id:'',errors:[],warnings:[],checks:[]};
  if(e.error){rec.parseError='读取失败：'+e.error;return rec;}
  var doc;
  try{if(typeof jsyaml==='undefined'){throw new Error('js-yaml 未加载（检查网络/CDN）');}doc=jsyaml.load(rec.raw);}
  catch(err){rec.parseError='YAML 解析失败：'+(err&&err.message?err.message:String(err));return rec;}
  if(!isObj(doc)){rec.parseError='顶层不是 YAML 映射';return rec;}
  var spec=isObj(doc.spec)?doc.spec:(doc.type?doc:null);
  if(!spec){rec.parseError='未找到 spec 根节点或 type 字段，可能不是 SPEC 文件';return rec;}
  rec.spec=spec;rec.isSpec=true;rec.type=(KNOWN_TYPES.indexOf(spec.type)>=0)?spec.type:'unknown';
  rec.id=spec.id?String(spec.id):'';
  if(spec.name){rec.name=String(spec.name);}
  var v=validateSpec(spec);
  rec.errors=v.errors;rec.warnings=v.warnings;rec.checks=v.checks;
  return rec;
}
function ingest(entries){
  entries=entries.filter(function(e){return e&&/\.ya?ml$/i.test(e.name||'');});
  entries.sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
  state.specs=entries.map(buildRecord);
  $('projectLabel').textContent=state.specs.length?state.specs.length+' 个 YAML 文件':'未加载';
  renderFilters();renderStats();renderList();
  var hash='';
  try{hash=decodeURIComponent(location.hash.replace(/^#/,''));}catch(e){}
  var rec=null;
  if(hash){for(var i=0;i<state.specs.length;i++){var r=state.specs[i];if(r.id===hash||r.path===hash||r.name===hash){rec=r;break;}}}
  if(!rec&&state.specs.length){rec=state.specs[0];}
  if(rec){select(rec.path);}else{showWelcome();}
}

/* ================= 侧栏 ================= */
function filtered(){
  var q=state.q.trim().toLowerCase();
  return state.specs.filter(function(rec){
    if(state.hideNon&&!rec.isSpec){return false;}
    if(state.type!=='all'&&rec.type!==state.type){return false;}
    if(state.status!=='all'){var s=rec.spec&&rec.spec.status;if(s!==state.status){return false;}}
    if(!q){return true;}
    var hay=[rec.name,rec.path,rec.id,rec.spec&&rec.spec.name,rec.spec&&rec.spec.goal,rec.spec&&rec.spec.context,rec.spec&&rec.spec.symptom,rec.spec&&rec.spec.question].filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(q)>=0||rec.raw.toLowerCase().indexOf(q)>=0;
  });
}
function renderFilters(){
  var counts={all:0};
  KNOWN_TYPES.forEach(function(t){counts[t]=0;});
  state.specs.forEach(function(rec){if(state.hideNon&&!rec.isSpec){return;}counts.all++;if(counts[rec.type]!=null){counts[rec.type]++;}});
  var h='<div style="display:flex;flex-wrap:wrap;gap:.35rem">';
  var chips=[['all','全部']].concat(KNOWN_TYPES.map(function(t){return [t,TYPE_META[t].label];}));
  chips.forEach(function(pair){
    var on=state.type===pair[0];
    h+='<button class="chip '+(pair[0]==='all'?(on?'t-unknown':''):TYPE_META[pair[0]].cls)+'" data-type="'+pair[0]+'" style="cursor:pointer;border:1px solid '+(on?'currentColor':'transparent')+';opacity:'+(on?'1':'.72')+'">'+esc(pair[1])+' <span style="opacity:.7">'+(counts[pair[0]]||0)+'</span></button>';
  });
  h+='</div>';
  h+='<div style="display:flex;align-items:center;gap:.5rem;margin-top:.55rem">';
  h+='<select id="statusSel" class="input" style="flex:1">';
  h+='<option value="all"'+(state.status==='all'?' selected':'')+'>全部状态</option>';
  KNOWN_STATUS.forEach(function(s){h+='<option value="'+s+'"'+(state.status===s?' selected':'')+'>'+STATUS_META[s].label+'</option>';});
  h+='</select>';
  h+='<label class="faint" style="font-size:.72rem;display:flex;align-items:center;gap:.3rem;white-space:nowrap"><input type="checkbox" id="hideNon"'+(state.hideNon?' checked':'')+'> 隐藏非 SPEC</label>';
  h+='</div>';
  $('filters').innerHTML=h;
}
function listItem(rec){
  var active=state.selected===rec.path?' active':'';
  var t=TYPE_META[rec.type]||TYPE_META.unknown;
  var st=STATUS_META[(rec.spec&&rec.spec.status)||'unknown']||STATUS_META.unknown;
  var issues;
  if(rec.parseError){issues='<span class="badge badge-err">解析失败</span>';}
  else if(rec.errors.length){issues='<span class="badge badge-err">'+rec.errors.length+' error</span>';}
  else if(rec.warnings.length){issues='<span class="badge badge-warn">'+rec.warnings.length+' warn</span>';}
  else{issues='<span class="badge badge-ok">OK</span>';}
  return '<button class="side-item'+active+'" data-path="'+escAttr(rec.path)+'">'
    +'<span class="side-item-name">'+esc(rec.name)+'</span>'
    +'<span class="side-item-meta">'+esc(rec.id||rec.path)+'</span>'
    +'<span class="side-item-badges">'+chip(t.cls,t.label)+'<span class="chip '+st.cls+'">'+st.label+'</span>'+issues+'</span>'
    +'</button>';
}
function renderList(){
  var arr=filtered();
  var groups={};
  arr.forEach(function(rec){var t=rec.isSpec?rec.type:'__other__';(groups[t]=groups[t]||[]).push(rec);});
  var order=['feature','bugfix','refactor','research','ops','unknown','__other__'];
  var total=state.specs.length;var h='';
  if(!total){$('spec-list').innerHTML='<div class="muted" style="padding:.75rem;font-size:.82rem">还没有加载 SPEC。</div>';return;}
  order.forEach(function(t){
    var items=groups[t];if(!items||!items.length){return;}
    var meta=TYPE_META[t]||TYPE_META.unknown;
    var label=t==='__other__'?'未识别 / 解析失败':(meta.label+' · '+t);
    h+='<div style="margin-top:.25rem">';
    h+='<div class="side-group"><span class="side-dot" style="background:'+meta.color+'"></span>'+esc(label)+'<span style="margin-left:auto">'+items.length+'</span></div>';
    items.forEach(function(rec){h+=listItem(rec);});
    h+='</div>';
  });
  if(!h){h='<div class="muted" style="padding:.75rem;font-size:.82rem">没有匹配的 SPEC。</div>';}
  $('spec-list').innerHTML=h;
}
function renderStats(){
  var valid=0,errs=0,warns=0;
  state.specs.forEach(function(r){if(r.isSpec){valid++;}errs+=r.errors.length;warns+=r.warnings.length;});
  $('stats').textContent=valid+' 份 SPEC · '+errs+' error · '+warns+' warning';
}

/* ================= 详情渲染 ================= */
function select(path){
  var rec=null,i;
  for(i=0;i<state.specs.length;i++){if(state.specs[i].path===path){rec=state.specs[i];break;}}
  if(!rec){return;}
  state.selected=path;state.current=rec;
  try{history.replaceState(null,'','#'+encodeURIComponent(rec.id||rec.name));}catch(e){}
  renderList();renderDetail(rec);
  var m=$('main');if(m){m.scrollTop=0;}
}

function issue(kind,text){

function renderValidation(rec){
  var n=rec.errors.length,w=rec.warnings.length;
  if(!n&&!w){return '<div style="margin-top:1rem">'+callout('ok','规则校验通过','<span class="muted">未发现 error / warning。</span>')+'</div>';}
  var h='<details style="margin-top:1rem"'+(n?' open':'')+'><summary class="val-summary">';
  h+='<span class="badge '+(n?'badge-err':'badge-warn')+'">'+(n?n+' error':'')+(n&&w?' · ':'')+(w?w+' warning':'')+'</span>';
  h+='<span class="muted" style="font-size:.82rem">规则校验（validate_spec.py）</span></summary>';
  h+='<div style="display:grid;gap:.5rem;margin-top:.6rem">';
  rec.errors.forEach(function(x){h+=issue('err',x);});
  rec.warnings.forEach(function(x){h+=issue('warn',x);});
  h+='</div></details>';

function formatScalar(x){
  if(isBlank(x)){return '<span class="muted">—</span>';}
  if(x===true){return '<span class="badge badge-ok">是</span>';}
  if(x===false){return '<span class="badge badge-warn">否</span>';}
  if(isObj(x)||isArr(x)){return genericInline(x);}
  return inline(String(x));
}
function genericInline(v){
  if(isBlank(v)){return '<span class="muted">—</span>';}
  if(isArr(v)){
    if(!v.length){return '<span class="muted">—</span>';}
    if(v.every(function(x){return !isObj(x)&&!isArr(x);})){return inline(v.join('、'));}
    return '<code class="code">'+esc(JSON.stringify(v))+'</code>';
  }
  if(isObj(v)){return '<code class="code">'+esc(JSON.stringify(v))+'</code>';}
  return inline(String(v));
}
function renderBullets(v){
  var items=asArr(v);
  if(!items.length){return '<p class="muted" style="font-size:.85rem;margin:0">（空）</p>';}
  return '<ul class="bullets">'+items.map(function(x){return '<li>'+formatScalar(x)+'</li>';}).join('')+'</ul>';
}
function renderLinks(v){

    return '<li>'+inline(s)+'</li>';
  }).join('')+'</ul>';
}
function renderSteps(v){

}
function renderInputs(v){

  return h;
}
function levelBadge(x){
  var v=String(x||'').toLowerCase();
  var cls=v==='high'||v==='critical'?'badge-err':(v==='medium'?'badge-warn':(v==='low'?'badge-ok':'badge-ok'));
  return '<span class="badge '+cls+'">'+esc(x==null?'—':x)+'</span>';
}
function renderRisks(v){
  var rows=asArr(v).map(function(it){
    if(!isObj(it)){return [inline(String(it)),'','','']; }
    return ['<b>'+esc(it.risk||'—')+'</b>',levelBadge(it.likelihood),levelBadge(it.impact),'<div class="prose">'+inline(it.mitigation||'—')+'</div>'];
  });
  return table(['风险','可能性','影响','缓解措施'],rows);
}
function renderRollback(v){
  if(isBlank(v)){return '<p class="muted" style="font-size:.85rem;margin:0">（空）</p>';}
  if(!isObj(v)){return '<div class="card card-pad prose">'+inline(String(v))+'</div>';}
  var h='<div class="card card-pad">';
  if(v.trigger){h+=kv('触发条件',inline(v.trigger));}
  if(asArr(v.steps).length){h+=kv('回滚步骤',renderSteps(v.steps));}
  Object.keys(v).forEach(function(k){if(['trigger','steps'].indexOf(k)<0){h+=kv(k,formatScalar(v[k]));}});
  h+='</div>';
  return h;
}
function renderMonitoring(v){
  var rows=asArr(v).map(function(it){
    if(!isObj(it)){return [inline(String(it)),'','','']; }
    return ['<b>'+esc(it.metric||'—')+'</b>','<code class="code">'+esc(it.threshold||'—')+'</code>',esc(it.window||'—'),'<div class="prose">'+inline(it.action||'—')+'</div>'];
  });
  return table(['指标','阈值','观察窗口','异常动作'],rows);
}
function renderFailureHandling(v){
  var rows=asArr(v).map(function(it){
    if(!isObj(it)){return [inline(String(it)),'']; }
    return ['<div class="prose">'+inline(it.scenario||'—')+'</div>','<div class="prose">'+inline(it.handling||'—')+'</div>'];
  });
  return table(['场景','处理方式'],rows);
}
function renderExamples(v){
  var items=asArr(v);
  if(!items.length){return '<p class="muted" style="font-size:.85rem;margin:0">（空）</p>';}
  return '<div style="display:grid;gap:.65rem">'+items.map(function(ex){
    if(!isObj(ex)){return '<div class="card card-pad prose">'+inline(String(ex))+'</div>';}
    return '<div class="card card-pad"><div class="grid-2" style="display:grid;gap:.8rem">'
      +'<div><div class="field-label">输入</div><div class="prose">'+inline(ex.input||'—')+'</div></div>'
      +'<div><div class="field-label">输出</div><div class="prose">'+inline(ex.output||'—')+'</div></div>'
      +'</div></div>';
  }).join('')+'</div>';
}
function renderChecklist(field,v,rec){
  var items=asArr(v);
  if(!items.length){return '<p class="muted" style="font-size:.85rem;margin:0">（空）</p>';}
  var key=rec.id||rec.path;
  var store=loadChecks(key+'::'+field);
  var h='<div class="checklist" data-check-key="'+escAttr(key)+'" data-check-field="'+escAttr(field)+'">';
  var done=0;
  items.forEach(function(item,i){
    var text=typeof item==='string'?item:JSON.stringify(item);
    var weak=field==='acceptance_criteria'&&weakItem(text);
    var checked=!!store[i];
    if(checked){done++;}
    h+='<label class="check-item'+(weak?' weak':'')+'">';
    h+='<input type="checkbox" class="chk" data-idx="'+i+'"'+(checked?' checked':'')+'>';
    h+='<span class="check-num">'+(i+1)+'</span>';
    h+='<span class="check-text'+(checked?' done':'')+'">'+inline(text)+(weak?'<span class="tag-warn" title="疑似不可验证">弱</span>':'')+'</span>';
    h+='</label>';
  });
  h+='</div><div class="check-progress"><span class="check-count">'+done+' / '+items.length+'</span> 已完成</div>';
  return h;
}
function renderQuestions(k,title,v,kind){
  var items=asArr(v);
  var cls=kind==='blocking_questions'?'callout-err':(kind==='open_questions'?'callout-warn':'callout');
  var mark=kind==='blocking_questions'?'⛔':(kind==='assumptions'?'·':'?');
  if(!items.length){return section(k,title,'<p class="muted" style="font-size:.85rem;margin:0">（空）</p>');}
  var h='<div style="display:grid;gap:.5rem">'+items.map(function(x){
    return '<div class="callout '+cls+'"><div style="display:flex;gap:.5rem"><span>'+mark+'</span><div class="prose">'+inline(String(x))+'</div></div></div>';
  }).join('')+'</div>';
  return section(k,title,h);
}
function renderField(k,v,s,rec){
  var title=LABELS[k]||k;
  switch(k){
    case 'goal':case 'context':case 'background':case 'symptom':case 'question':case 'current_state':case 'motivation':
      return section(k,title,'<div class="card card-pad prose">'+inline(v)+'</div>');
    case 'assumptions':return renderQuestions(k,title,v,'assumptions');
    case 'blocking_questions':return renderQuestions(k,title,v,'blocking_questions');
    case 'open_questions':return renderQuestions(k,title,v,'open_questions');
    case 'inputs':return section(k,title,renderInputs(v));
    case 'outputs':return section(k,title,renderOutputs(v));
    case 'constraints':case 'out_of_scope':case 'tools':case 'behavior_contract':case 'changes':case 'hypotheses':case 'methods':case 'deliverables':case 'decision_criteria':
      return section(k,title,'<div class="card card-pad">'+renderBullets(v)+'</div>');
    case 'related':return section(k,title,'<div class="card card-pad">'+renderLinks(v)+'</div>');
    case 'steps':return section(k,title,'<div class="card card-pad">'+renderSteps(v)+'</div>');
    case 'acceptance_criteria':return section(k,title,renderChecklist(k,v,rec));
    case 'regression_tests':return section(k,title,renderChecklist(k,v,rec));
    case 'failure_handling':return section(k,title,renderFailureHandling(v));
    case 'examples':return section(k,title,renderExamples(v));
    case 'environment':return section(k,title,renderKVGrid(v));
    case 'reproduction':return section(k,title,renderReproduction(v));
    case 'evidence':return section(k,title,renderEvidence(v));
    case 'scope':return section(k,title,renderScope(v));
    case 'root_cause':return section(k,title,renderRootCause(v));
    case 'fix':return section(k,title,renderFix(v));
    case 'risks':return section(k,title,renderRisks(v));
    case 'rollback':return section(k,title,renderRollback(v));
    case 'monitoring':return section(k,title,renderMonitoring(v));
    case 'target':return section(k,title,renderKVGrid(v));
    case 'timebox':return section(k,title,'<span class="chip t-unknown">'+esc(v)+'</span>');
    default:return section(k,title,generic(v));
  }
}
function generic(v){
  if(isBlank(v)){return '<p class="muted" style="font-size:.85rem;margin:0">（空）</p>';}
  if(isArr(v)){
    if(v.every(function(x){return !isObj(x)&&!isArr(x);})){return '<div class="card card-pad">'+renderBullets(v)+'</div>';}
    var keys=[];
    v.forEach(function(x){if(isObj(x)){Object.keys(x).forEach(function(k){if(keys.indexOf(k)<0){keys.push(k);}});}});
    return table(keys,v.map(function(x){return keys.map(function(k){return formatScalar(x&&x[k]);});}));
  }
  if(isObj(v)){
    var h='<div class="card card-pad">';
    Object.keys(v).forEach(function(k){h+=kv(k,formatScalar(v[k]));});
    return h+'</div>';
  }
  return '<div class="card card-pad prose">'+inline(String(v))+'</div>';
}
function renderBody(rec){
  var s=rec.spec;
  var order=BODY_ORDER[rec.type]||Object.keys(s);
  var seen={};var h='';
  order.forEach(function(k){if(!(k in s)){return;}seen[k]=true;h+=renderField(k,s[k],s,rec);});
  var extras=Object.keys(s).filter(function(k){return !seen[k]&&META_KEYS.indexOf(k)<0;});
  extras.forEach(function(k){h+=renderField(k,s[k],s,rec);});
  return h;
}
function renderRaw(rec){
  return '<details class="raw"><summary>原始 YAML · '+esc(rec.path)+'</summary><div style="position:relative;margin-top:.5rem"><button class="copy-btn" style="position:absolute;top:.5rem;right:.5rem" data-copy-src="raw">复制</button><pre class="codeblock">'+esc(rec.raw)+'</pre></div></details>';
}
function renderParseError(rec){
  return '<div class="card card-pad"><div class="callout callout-err"><div class="callout-title">无法解析为 SPEC</div><div>'+esc(rec.parseError)+'</div></div>'
    +'<details class="raw" open><summary>文件内容</summary><pre class="codeblock" style="margin-top:.5rem">'+esc(rec.raw)+'</pre></details></div>';
}
function renderDetail(rec){
  var el=$('detail'),w=$('welcome');
  var h='<div class="wrap">';
  if(rec.parseError){h+=renderParseError(rec);}
  else{h+=renderHeader(rec);h+=renderValidation(rec);h+=renderBody(rec);h+=renderRaw(rec);}
  h+='</div>';
  el.innerHTML=h;el.hidden=false;w.hidden=true;
}

/* ================= 清单持久化 ================= */
function loadChecks(k){try{var m=JSON.parse(localStorage.getItem('specview.checks')||'{}');return m[k]||{};}catch(e){return {};}}
function saveChecks(k,v){try{var m=JSON.parse(localStorage.getItem('specview.checks')||'{}');m[k]=v;localStorage.setItem('specview.checks',JSON.stringify(m));}catch(e){}}
function updateCheckProgress(box){
  var all=box.querySelectorAll('.chk').length;
  var done=box.querySelectorAll('.chk:checked').length;
  var next=box.nextElementSibling;
  if(next){var c=next.querySelector('.check-count');if(c){c.textContent=done+' / '+all;}}
}

/* ================= 复制 / toast ================= */
var toastTimer=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1700);}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}document.body.removeChild(ta);}
function copyText(t){if(!t){toast('没有可复制的内容');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('已复制');},function(){fallbackCopy(t);});}else{fallbackCopy(t);}}

/* ================= 加载 ---------- */
function showWelcome(){$('welcome').hidden=false;$('detail').hidden=true;}
function showLoadError(msg){$('loadError').innerHTML=msg?callout('warn','提示',esc(msg)):'';}
function loadFromHandle(handle){
  var entries=[];
  var it=handle.values();
  function step(res){return it.next().then(function(r){
    if(r.done){return Promise.resolve();}
    var entry=r.value;
    if(entry.kind!=='file'||!/\.ya?ml$/i.test(entry.name)){return step();}
    return entry.getFile().then(function(f){return f.text();}).then(function(text){entries.push({name:entry.name,path:entry.name,text:text});return step();});
  });}
  return step().then(function(){
    if(!entries.length){ingest([]);showWelcome();showLoadError('该目录下没有 .yaml / .yml 文件。');return;}
    ingest(entries);
  });
}
function loadFromInputFiles(files){
  var list=Array.prototype.slice.call(files||[]).filter(function(f){return /\.ya?ml$/i.test(f.name);});
  if(!list.length){return Promise.resolve([]);}
  return Promise.all(list.map(function(f){
    return f.text().then(function(text){return {name:f.name,path:f.webkitRelativePath||f.name,text:text};},function(err){return {name:f.name,path:f.name,text:'',error:String(err)};});
  }));
}
function walkEntry(entry,path,out){
  if(entry.isFile){
    if(!/\.ya?ml$/i.test(entry.name)){return Promise.resolve();}
    return new Promise(function(res,rej){entry.file(res,rej);}).then(function(file){return file.text();}).then(function(text){out.push({name:entry.name,path:path,text:text});});
  }
  if(entry.isDirectory){
    var reader=entry.createReader();
    var all=[];
    function readBatch(){return new Promise(function(res,rej){reader.readEntries(res,rej);}).then(function(batch){if(!batch.length){return; }all=all.concat(batch);return readBatch();});}
    return readBatch().then(function(){
      var chain=Promise.resolve();
      all.forEach(function(child){chain=chain.then(function(){return walkEntry(child,path+'/'+child.name,out);});});
      return chain;
    });
  }
  return Promise.resolve();
}
function idbOpen(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('spec-viewer',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
}
function idbGet(k){return idbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readonly');var q=tx.objectStore('kv').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}).catch(function(){return undefined;});}
function idbSet(k,v){return idbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});}).catch(function(){});}

function pickDirectory(){
  if(location.protocol!=='file:'&&window.showDirectoryPicker){
    window.showDirectoryPicker({id:'specs-viewer',mode:'read'}).then(function(handle){
      idbSet('dirHandle',handle);
      return loadFromHandle(handle);
    }).catch(function(err){
      if(err&&err.name==='AbortError'){return;}
      $('dirInput').click();
    });
    return;
  }
  $('dirInput').click();
}
function discoverHttp(){
  return fetch('./',{headers:{'Accept':'text/html'},cache:'no-store'}).then(function(res){
    if(!res.ok){return false;}
    var ct=res.headers.get('content-type')||'';
    if(ct.indexOf('text/html')<0){return false;}
    return res.text();
  }).then(function(html){
    if(!html){return false;}
    if(html.indexOf('id="spec-viewer-app"')>=0){return false;}
    var doc=new DOMParser().parseFromString(html,'text/html');
    var links=doc.querySelectorAll('a[href]');
    var files=[];var seen={};
    for(var i=0;i<links.length;i++){
      var href=links[i].getAttribute('href')||'';
      if(!/\.ya?ml($|[?#])/i.test(href)){continue;}
      var clean=href.split('#')[0].split('?')[0];
      try{clean=decodeURIComponent(clean);}catch(e){}
      if(seen[clean]){continue;}seen[clean]=true;files.push(clean);
    }
    if(!files.length){return false;}
    return Promise.all(files.map(function(u){
      return fetch(u,{cache:'no-store'}).then(function(r){
        if(!r.ok){throw new Error('HTTP '+r.status);}
        return r.text().then(function(text){return {name:u.split('/').pop(),path:u,text:text};});
      }).catch(function(err){return {name:u.split('/').pop(),path:u,text:'',error:String(err)};});
    })).then(function(entries){ingest(entries);return true;});
  }).catch(function(){return false;});
}
function boot(){
  initTheme();
  window.addEventListener('hashchange',function(){
    var h='';try{h=decodeURIComponent(location.hash.replace(/^#/,''));}catch(e){}
    if(!h){return;}
    for(var i=0;i<state.specs.length;i++){var r=state.specs[i];if(r.id===h||r.path===h||r.name===h){select(r.path);return;}}
  });
  document.addEventListener('click',function(e){
    var t=e.target;
    if(!t||!t.closest){return;}
    var copy=t.closest('[data-copy],[data-copy-src]');
    if(copy){
      if(copy.getAttribute('data-copy-src')==='raw'&&state.current){copyText(state.current.raw);}
      else{copyText(copy.getAttribute('data-copy')||'');}
      return;
    }
    var item=t.closest('.side-item');
    if(item){select(item.getAttribute('data-path'));return;}
    var typeChip=t.closest('[data-type]');
    if(typeChip){state.type=typeChip.getAttribute('data-type');renderFilters();renderList();return;}
    if(t.closest('#pickBtn')||t.closest('#pickBtn2')||t.closest('#dropzone')&&t.closest('button')){pickDirectory();return;}
    if(t.closest('#reloadBtn')){
      if(location.protocol==='http:'||location.protocol==='https:'){discoverHttp().then(function(ok){if(!ok){showLoadError('未自动发现 YAML，请选择文件夹。');}});}
      else{idbGet('dirHandle').then(function(h){if(h&&h.queryPermission){h.queryPermission({mode:'read'}).then(function(p){if(p==='granted'){loadFromHandle(h);}else{pickDirectory();}});}else{pickDirectory();}});}
      return;
    }
    if(t.closest('#themeBtn')){toggleTheme();return;}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(!t){return;}
    if(t.classList&&t.classList.contains('chk')){
      var box=t.closest('.checklist');
      if(box){
        var key=box.getAttribute('data-check-key'),field=box.getAttribute('data-check-field');
        var idx=parseInt(t.getAttribute('data-idx'),10);
        var store=loadChecks(key+'::'+field);store[idx]=t.checked;saveChecks(key+'::'+field,store);
        var txt=t.parentElement.querySelector('.check-text');
        if(txt){txt.classList.toggle('done',t.checked);}
        updateCheckProgress(box);
      }
      return;
    }
    if(t.id==='hideNon'){state.hideNon=t.checked;renderFilters();renderList();return;}
    if(t.id==='statusSel'){state.status=t.value;renderList();return;}
  });
  $('search').addEventListener('input',function(e){state.q=e.target.value;renderList();});
  $('dirInput').addEventListener('change',function(){loadFromInputFiles($('dirInput').files).then(function(entries){if(!entries.length){showLoadError('所选目录下没有 .yaml / .yml 文件。');return;}ingest(entries);$('dirInput').value='';});});
  var dz=$('dropzone');
  function stop(e){e.preventDefault();e.stopPropagation();}
  ['dragenter','dragover'].forEach(function(ev){document.addEventListener(ev,function(e){stop(e);if(dz){dz.classList.add('drag');}});});
  ['dragleave','drop'].forEach(function(ev){document.addEventListener(ev,function(e){stop(e);if(ev==='dragleave'&&e.relatedTarget){return;}if(dz){dz.classList.remove('drag');}});});
  document.addEventListener('drop',function(e){
    var dt=e.dataTransfer;if(!dt){return;}
    var items=dt.items;var roots=[];
    if(items){for(var i=0;i<items.length;i++){var it=items[i];if(it.kind==='file'&&it.webkitGetAsEntry){var en=it.webkitGetAsEntry();if(en){roots.push(en);}}}}
    if(roots.length){
      var out=[];var chain=Promise.resolve();
      roots.forEach(function(r){chain=chain.then(function(){return walkEntry(r,r.name,out);});});
      chain.then(function(){if(!out.length){showLoadError('拖入的内容里没有 .yaml / .yml 文件。');return;}ingest(out);});
    }else if(dt.files&&dt.files.length){
      loadFromInputFiles(dt.files).then(function(entries){if(!entries.length){showLoadError('拖入的内容里没有 .yaml / .yml 文件。');return;}ingest(entries);});
    }
  });

  if(location.protocol==='http:'||location.protocol==='https:'){
    discoverHttp().then(function(ok){
      if(ok){return;}
      showWelcome();showLoadError('未能自动发现 YAML（服务器可能未开启目录列表）。可点“选择 specs 文件夹”，或按上面的命令用 http.server 打开。');
    });
    return;
  }
  idbGet('dirHandle').then(function(h){
    if(!h||!h.queryPermission){showWelcome();return;}
    h.queryPermission({mode:'read'}).then(function(p){
      if(p==='granted'){loadFromHandle(h);}
      else{showWelcome();showLoadError('浏览器需要重新授权后才能读取上次的 specs 目录，请点“选择 specs 文件夹”。');}
    }).catch(function(){showWelcome();});
  }).catch(function(){showWelcome();});
}

/* ================= 主题 ================= */
function initTheme(){
  var saved=null;try{saved=localStorage.getItem('specview.theme');}catch(e){}
  state.theme=saved||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  document.documentElement.classList.toggle('dark',state.theme==='dark');
}
function toggleTheme(){
  state.theme=state.theme==='dark'?'light':'dark';
  try{localStorage.setItem('specview.theme',state.theme);}catch(e){}
  document.documentElement.classList.toggle('dark',state.theme==='dark');
}

boot();
})();
</script>
