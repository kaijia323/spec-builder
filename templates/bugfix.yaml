# bugfix 模板 —— 缺陷修复（期望行为 != 实际行为）
# 收尾（做完了必须做）：python3 scripts/spec_status.py <本文件> --to done --by <你> \
#   --note "原复现步骤不再出现，回归测试通过" --result "3/3 AC 通过" \
#   --acceptance "AC#1 原步骤不再复现|pass|跑过的命令或证据"
spec:
  type: bugfix
  name: ""
  id: bugfix-<slug>
  version: 1
  updated: "2026-09-14"
  status: draft          # draft | ready | in_progress | done | verified | blocked
  blocked_reason: ""     # status=blocked 时必填（G4）
  status_log: []         # 追加式，不要覆盖历史：每次状态转移加一条 {date, from, to, by, version, note}
  related: []
  severity: medium       # low | medium | high | critical
  symptom: ""            # 用户看到的现象
  context: ""
  assumptions: []
  blocking_questions: [] # 不问就不能开工。结构：- {q: "这个报错是所有账号都出现，还是只有特定环境？", answered: false,
                         #   asked_at: "", answer: ""}；没有要问的就保持 []。
                         # 纯字符串 = 还没问过用户（会被当成 status: open，ready/done 时被 G1 拦住）
  open_questions: []     # 可以先做但必须让用户知情。结构：- {q: "...", status: open|answered|assumed,
                         #   asked_at: "", answer: "", assumption: "", if_wrong: "", confirm_by: ""}
                         # status=open 表示还没问过用户；assumed 必须填 assumption / if_wrong / confirm_by

  environment:
    version: ""
    os: ""
    runtime: ""
    account: ""
    config: ""

  reproduction:
    steps:
      - ""
    expected: ""         # 期望行为
    actual: ""           # 实际行为
    frequency: always    # always | intermittent | once

  evidence:
    - type: ""           # log | network | screenshot | stacktrace | file
      detail: ""
      location: ""

  scope:
    affected: []         # 受影响的模块 / 行为
    not_affected: []     # 明确不受影响的部分

  root_cause:
    hypothesis: ""       # 根因假设
    evidence: ""         # 支持假设的证据
    confirmed: false     # 未确认时，fix 应先给定位方案

  fix:
    approach: ""
    files: []
    constraints: []      # 例如：最小改动、不引入新依赖
    alternatives_considered: []

  regression_tests:      # 修复后必须跑的场景
    - ""

  acceptance_criteria:
    - ""

  verification: {}       # G2：status=done/verified 时必须写
                         # （用 python3 scripts/spec_status.py <本文件> --to done ... 会自动写入）
                         # 结构：{result: "结论 + 关键数字", verified_by: self|independent|user,
                         #   verifier: "复核者", verified_at: "YYYY-MM-DD",
                         #   acceptance: [{criterion: "AC#1 ...", status: pass|fail|not_run, evidence: "..."}],
                         #   commands: [], artifacts: [], unverified: []}

  follow_ups: []         # 遗留问题：每条写清优先级与触发条件，例如 "F1（中）：同类缺陷还有 2 处未排查"

  failure_handling:
    - scenario: ""
      handling: ""

  examples:
    - input: ""
      output: ""
