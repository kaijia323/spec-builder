# research 模板 —— 先调研，再决策
# 收尾（做完了必须做）：python3 scripts/spec_status.py <本文件> --to done --by <你> \
#   --note "调研完成，结论与依据已写进 verification" --result "结论：选 A，依据：压测 P95 120ms" \
#   --acceptance "AC#1 三种方案都有压测数据|pass|报告路径"
# 注意：research 的 verification 写「结论 + 依据」，commands 可以留空
spec:
  type: research
  name: ""
  id: research-<slug>
  version: 1
  updated: "2026-09-14"
  status: draft          # draft | ready | in_progress | done | verified | blocked
  blocked_reason: ""     # status=blocked 时必填（G4）
  status_log: []         # 追加式，不要覆盖历史：每次状态转移加一条 {date, from, to, by, version, note}
  related: []
  question: ""           # 要回答的核心问题
  background: ""
  context: ""
  assumptions: []
  blocking_questions: [] # 不问就不能开工。结构：- {q: "决策时间点是什么时候？", answered: false,
                         #   asked_at: "", answer: ""}；没有要问的就保持 []。
                         # 纯字符串 = 还没问过用户（会被当成 status: open，ready/done 时被 G1 拦住）
  open_questions: []     # 可以先做但必须让用户知情。结构：- {q: "...", status: open|answered|assumed,
                         #   asked_at: "", answer: "", assumption: "", if_wrong: "", confirm_by: ""}
                         # status=open 表示还没问过用户；assumed 必须填 assumption / if_wrong / confirm_by

  hypotheses:
    - ""

  methods:               # 调研 / 实验方法
    - ""

  deliverables:          # 产出：结论报告 / 选型建议 / POC
    - ""

  decision_criteria:     # 什么证据支持什么决策
    - ""

  timebox: ""            # 时间盒，例如：2 天

  acceptance_criteria:
    - ""

  verification: {}       # research 写「结论 + 依据」，commands 可空；G2：status=done/verified 时必须写
                         # （用 python3 scripts/spec_status.py <本文件> --to done ... 会自动写入）
                         # 结构：{result: "结论 + 关键数字", verified_by: self|independent|user,
                         #   verifier: "复核者", verified_at: "YYYY-MM-DD",
                         #   acceptance: [{criterion: "AC#1 ...", status: pass|fail|not_run, evidence: "..."}],
                         #   commands: [], artifacts: [], unverified: []}

  follow_ups: []         # 遗留问题：每条写清优先级与触发条件，例如 "F1（中）：生产环境量级待验证"

  failure_handling:
    - scenario: ""
      handling: ""

  examples:
    - input: ""
      output: ""
